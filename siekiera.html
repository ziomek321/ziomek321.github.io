<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przekierowanie...</title>

    <!-- 1) Przekierowanie przez meta refresh (działa nawet bez JS) -->
    <meta http-equiv="refresh" content="0; url=https://ziomek321.github.io/">

    <!-- 2) Przekierowanie przez JavaScript (szybsze, jako pierwsze się wykona) -->
    <script>
        window.location.replace("https://ziomek321.github.io/");
    </script>
</head>
<body>
    <p>Za chwilę zostaniesz przeniesiony. Jeśli nie nastąpi to automatycznie,
        <a href="https://ziomek321.github.io/">kliknij tutaj</a>.
    </p>
</body>
</html>
